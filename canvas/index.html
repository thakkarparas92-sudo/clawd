<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Momentum Board</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #141b32;
      --soft: #1b2443;
      --text: #ecf0ff;
      --muted: #a7b1d8;
      --accent: #6ea8fe;
      --accent-2: #95f2d8;
      --danger: #ff8f8f;
      --border: #2a355f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1d2a57 0%, var(--bg) 55%);
      color: var(--text);
      font: 16px/1.4 Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding: 24px;
    }

    .app {
      width: min(920px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      background: color-mix(in oklab, var(--panel) 92%, white 8%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 2vw, 1.9rem);
    }

    .subtitle {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .composer {
      display: grid;
      gap: 10px;
      grid-template-columns: 1.7fr 0.9fr auto;
    }

    input, select, button {
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--soft);
      color: var(--text);
      padding: 11px 12px;
      font: inherit;
    }

    button {
      cursor: pointer;
      background: linear-gradient(145deg, var(--accent), #5089eb);
      border: none;
      color: #0a163d;
      font-weight: 700;
      transition: transform 120ms ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 0.9rem;
    }

    .chip.active {
      background: color-mix(in oklab, var(--accent) 32%, var(--soft));
      color: var(--text);
      border-color: transparent;
    }

    .stats {
      color: var(--muted);
      font-size: 0.92rem;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 12px 0 0;
      display: grid;
      gap: 10px;
    }

    .task {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: color-mix(in oklab, var(--soft) 87%, black 13%);
      padding: 10px;
    }

    .task.done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-meta {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 2px;
    }

    .priority {
      font-size: 0.75rem;
      border-radius: 999px;
      padding: 4px 8px;
      border: 1px solid transparent;
    }

    .p-high { color: #ffd2d2; background: #5b2a2a; border-color: #804040; }
    .p-medium { color: #ffe7bf; background: #4f3a1e; border-color: #7c5d2e; }
    .p-low { color: #d4ffe9; background: #1f4637; border-color: #2f6b53; }

    .ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: 8px;
      font-weight: 600;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-top: 12px;
    }

    @media (max-width: 700px) {
      .composer {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>Momentum Board</h1>
      <p class="subtitle">A simple productivity web app to capture tasks and keep momentum.</p>

      <form id="task-form" class="composer" autocomplete="off">
        <input id="task-input" name="task" placeholder="What do you need to do?" required maxlength="120" />
        <select id="priority-input" name="priority" aria-label="Priority">
          <option value="high">High priority</option>
          <option value="medium" selected>Medium priority</option>
          <option value="low">Low priority</option>
        </select>
        <button type="submit">Add Task</button>
      </form>

      <div class="toolbar">
        <div class="filters" id="filters">
          <button type="button" class="chip active" data-filter="all">All</button>
          <button type="button" class="chip" data-filter="open">Open</button>
          <button type="button" class="chip" data-filter="done">Done</button>
        </div>
        <div class="stats" id="stats">0 tasks</div>
      </div>

      <ul id="task-list" aria-live="polite"></ul>
      <div class="empty" id="empty-state">No tasks yet. Add one above to get started.</div>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "momentum-board-tasks";
      const listEl = document.getElementById("task-list");
      const formEl = document.getElementById("task-form");
      const inputEl = document.getElementById("task-input");
      const priorityEl = document.getElementById("priority-input");
      const statsEl = document.getElementById("stats");
      const emptyStateEl = document.getElementById("empty-state");
      const filterWrapEl = document.getElementById("filters");

      let filter = "all";
      const tasks = loadTasks();

      function loadTasks() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        } catch {
          return [];
        }
      }

      function persist() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function addTask(text, priority) {
        tasks.unshift({
          id: crypto.randomUUID(),
          text,
          priority,
          done: false,
          createdAt: new Date().toISOString(),
        });
        persist();
        render();
      }

      function deleteTask(id) {
        const idx = tasks.findIndex((task) => task.id === id);
        if (idx > -1) {
          tasks.splice(idx, 1);
          persist();
          render();
        }
      }

      function toggleTask(id) {
        const task = tasks.find((item) => item.id === id);
        if (!task) {
          return;
        }
        task.done = !task.done;
        persist();
        render();
      }

      function formatDate(isoDate) {
        return new Date(isoDate).toLocaleString([], {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function render() {
        listEl.innerHTML = "";
        const visible = tasks.filter((task) => {
          if (filter === "done") {
            return task.done;
          }
          if (filter === "open") {
            return !task.done;
          }
          return true;
        });

        visible.forEach((task) => {
          const item = document.createElement("li");
          item.className = `task ${task.done ? "done" : ""}`;

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = task.done;
          checkbox.setAttribute("aria-label", `Mark ${task.text} as done`);
          checkbox.addEventListener("change", () => toggleTask(task.id));

          const content = document.createElement("div");
          const text = document.createElement("div");
          text.className = "task-text";
          text.textContent = task.text;
          const meta = document.createElement("div");
          meta.className = "task-meta";
          meta.textContent = `Created ${formatDate(task.createdAt)}`;
          content.append(text, meta);

          const actions = document.createElement("div");
          const priorityBadge = document.createElement("span");
          priorityBadge.className = `priority p-${task.priority}`;
          priorityBadge.textContent = `${task.priority} priority`;

          const removeButton = document.createElement("button");
          removeButton.className = "ghost";
          removeButton.type = "button";
          removeButton.textContent = "Delete";
          removeButton.addEventListener("click", () => deleteTask(task.id));

          actions.append(priorityBadge, removeButton);
          actions.style.display = "flex";
          actions.style.gap = "8px";
          actions.style.alignItems = "center";

          item.append(checkbox, content, actions);
          listEl.append(item);
        });

        const doneCount = tasks.filter((task) => task.done).length;
        statsEl.textContent = `${tasks.length} total • ${doneCount} completed`;
        emptyStateEl.hidden = visible.length > 0;
      }

      formEl.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = inputEl.value.trim();
        if (!text) {
          return;
        }
        addTask(text, priorityEl.value);
        formEl.reset();
        priorityEl.value = "medium";
        inputEl.focus();
      });

      filterWrapEl.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-filter]");
        if (!button) {
          return;
        }
        filter = button.dataset.filter;
        filterWrapEl.querySelectorAll("button").forEach((chip) => {
          chip.classList.toggle("active", chip === button);
        });
        render();
      });

      render();
    })();
  </script>
</body>
</html>
